services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartlab
      POSTGRES_PASSWORD: smartlab
      POSTGRES_DB: smartlab
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlab"]
      interval: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -s3 -dir=/data
    ports: ["8333:8333"]
    volumes: [s3data:/data]

  backend:
    build:
      context: ./backend
      args:
        WITH_DOCLING: ${WITH_DOCLING:-0}
    environment:
      DATABASE_URL: postgresql+psycopg://smartlab:smartlab@db:5432/smartlab
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: smartlab
      S3_ACCESS_KEY: smartlab
      S3_SECRET_KEY: smartlab
      SEGMENTATION_URL: ${SEGMENTATION_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_started }
      qdrant: { condition: service_started }
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  pgdata:
  qdrant:
  s3data:
